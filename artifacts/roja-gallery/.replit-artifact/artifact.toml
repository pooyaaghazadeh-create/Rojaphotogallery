kind = "web"
previewPath = "/"
title = "Roja — City Photography"
description = "An editorial portfolio for city photographer Roja, with interactive city and series galleries, a photo viewer, and an album/photo management workspace."
version = "1.0.0"
id = "artifacts/roja-gallery"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22837

[services.development]
run = "pnpm --filter @workspace/roja-gallery run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/roja-gallery", "run", "build" ]
serve = "static"
publicDir = "artifacts/roja-gallery/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22837"
BASE_PATH = "/"
